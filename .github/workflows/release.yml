name: Release

# Push a tag like v2.0.0 to build the Windows installer and the portable exe
# and attach them to a draft GitHub release. "Run workflow" builds the same
# files and keeps them as workflow artifacts without making a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - name: Build app
        working-directory: app
        run: npm run tauri build

      - name: Collect files
        shell: bash
        run: |
          mkdir out
          cp app/src-tauri/target/release/bundle/nsis/*.exe out/
          # The bare executable runs without installing (needs WebView2, which
          # Windows 10/11 already have).
          exe=$(find app/src-tauri/target/release -maxdepth 1 -name '*.exe' | head -n 1)
          cp "$exe" "out/FFR-Analyzer-portable-${GITHUB_REF_NAME//\//-}.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ffr-analyzer-windows
          path: out/*

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          # v2.0.0-alpha.1, v2.1.0-rc.2, ... are marked as pre-releases
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" out/* $pre \
            --draft --title "FFR Analyzer $GITHUB_REF_NAME" --generate-notes
