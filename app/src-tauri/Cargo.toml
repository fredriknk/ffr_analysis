[package]
name = "ffr-analyzer"
version = "2.2.1"
description = "Field Flux Robot analysis workspace"
edition = "2021"
rust-version = "1.100"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffr-core = { path = "../../crates/ffr-core" }

base64 = "0.22"

[dev-dependencies]
tempfile = "3"
